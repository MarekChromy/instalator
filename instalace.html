    function init() {
        const tabsCont = document.getElementById('tabs-container');
        const sectsCont = document.getElementById('sections-container');
        Object.keys(categories).forEach((catKey, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = categories[catKey];
            btn.onclick = (e) => openTab(e, catKey);
            tabsCont.appendChild(btn);
            const sect = document.createElement('div');
            sect.id = catKey; sect.className = `section ${index === 0 ? 'active' : ''}`;
            const grid = document.createElement('div'); grid.className = 'app-grid';
            apps.filter(a => a.cat === catKey).forEach(app => {
                grid.innerHTML += `<div class="app-item"><input type="checkbox" data-id="${app.id}" ${app.checked ? 'checked' : ''}><div><span class="app-name">${app.name}</span><span class="app-desc">${app.desc}</span></div></div>`;
            });
            sect.appendChild(grid); sectsCont.appendChild(sect);
        });
    }

    function openTab(evt, name) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active'); evt.currentTarget.classList.add('active');
    }

    function generateAndDownload() {
        let pkgs = ["unrar", "p7zip-full", "curl", "wget", "net-tools", "ffmpeg", "libavcodec-extra"];
        let ppa = [];
        let script = "#!/bin/bash\n# KUBUNTU BEAST MEGA SCRIPT\nsudo -v\nsudo dpkg --add-architecture i386\n";

        const thincast = document.querySelector('input[data-id="thincast-client"]');
        if(thincast && thincast.checked) {
            script += "wget -qO- https://dl.thincast.com/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/thincast.gpg\n";
            script += "echo 'deb [signed-by=/usr/share/keyrings/thincast.gpg] https://dl.thincast.com/apt/ stable main' | sudo tee /etc/apt/sources.list.d/thincast.list\n";
            pkgs.push("thincast-client");
        }

        const edge = document.querySelector('input[data-id="microsoft-edge-stable"]');
        if(edge && edge.checked) {
            script += "wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-edge.gpg > /dev/null\necho 'deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main' | sudo tee /etc/apt/sources.list.d/microsoft-edge.list\n";
            pkgs.push("microsoft-edge-stable");
        }

        document.querySelectorAll('input:checked').forEach(i => {
            let val = i.getAttribute('data-id');
            if(!val || val === "thincast-client" || val === "microsoft-edge-stable") return;
            if (val.startsWith('ppa:')) {
                ppa.push(val);
                if(val.includes('qbittorrent')) pkgs.push('qbittorrent');
                else if(val.includes('libreoffice')) pkgs.push('libreoffice');
                else if(val.includes('krita')) pkgs.push('krita');
                else if(val.includes('inkscape')) pkgs.push('inkscape');
                else if(val.includes('kdenlive')) pkgs.push('kdenlive');
                else if(val.includes('obsproject')) pkgs.push('obs-studio');
            } else { pkgs.push(val); }
        });

        ppa.forEach(p => script += `sudo add-apt-repository -y ${p}\n`);
        script += "sudo apt update && sudo apt install -y " + [...new Set(pkgs)].join(' ') + "\n";
        script += "echo '✅ INSTALACE HOTOVA! RESTARTUJTE PC.'; read\n";

        const blob = new Blob([script], { type: 'text/x-sh' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'run_install.sh';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        document.getElementById('info-box').style.display = 'block';
    }
